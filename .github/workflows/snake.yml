name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: fabiojnrdev
          outputs: |
            dist/github-contribution-grid-snake-dark.svg
      - uses: actions/upload-artifact@v3
        with:
          name: snake-graphics
          path: dist
      - uses: actions/checkout@v3
      - name: Commit files
        run: |
          mkdir -p output
          cp dist/github-contribution-grid-snake-dark.svg output/
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add output
          git commit -m "Generated snake"
          git push
